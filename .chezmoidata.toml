# Repo-wide template defaults. A machine overrides any key under [data] in
# ~/.config/chezmoi/chezmoi.toml (config data takes precedence over this file).

# Install playwright-cli's Claude Code skill into ~/.claude/skills. false removes it.
playwrightSkills = true

# Manage radicle (node config, supervisor, seeding). false treats every host as
# unenrolled — radicle targets are skipped and the node supervisor is stopped.
radicle = false
