name: hk
# Every gate hk knows about, full tree, on both platforms this repo templates for
# (.chezmoi.os-gated branches only render for real on the OS actually running them —
# see script/lint/chezmoi-templates.sh). This is the only thing that catches a bypassed
# local hook (--no-verify, a clone that skipped `mise run setup`, a GitButler commit
# path) — hk otherwise runs only as a local pre-commit/pre-push hook.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: --locked
      - run: hk check --all --no-fail-fast
