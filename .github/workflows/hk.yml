name: hk
# Every gate hk knows about, full tree, on both platforms this repo templates for
# (.chezmoi.os-gated branches only render for real on the OS actually running them —
# see script/lint/chezmoi-templates.sh). This is the only thing that catches a bypassed
# local hook (--no-verify, a clone that skipped `mise run setup`, a GitButler commit
# path) — hk otherwise runs only as a local pre-commit/pre-push hook.
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: --locked
      # zsh isn't preinstalled on GitHub's Linux runners (macOS runners ship it) and
      # isn't a mise-managed tool — the zsh-syntax hk step shells out to `zsh -n` directly.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh
      # pinact's `run` step verifies pinned action SHAs against the GitHub API; without
      # a token it goes out unauthenticated (60 req/hr, shared across the runner's IP
      # pool) and intermittently 403s. GITHUB_TOKEN raises that to 5000/hr and grants
      # nothing extra beyond the read-only `contents: read` already declared above.
      - run: hk check --all --no-fail-fast
        env:
          GITHUB_TOKEN: ${{ github.token }}
