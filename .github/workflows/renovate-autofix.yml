name: renovate-autofix
# Renovate's hosted GitHub App can bump a tool version in mise.lock, but it can't safely
# run `mise lock` itself to regenerate that version's checksums/URLs — that requires
# self-hosted Renovate + allowedUnsafeExecutions, which this repo doesn't run. Its
# fallback checksum computation is narrower than the real thing and has already produced
# an incomplete mise.lock entry once (fixed by hand in PR #7). This job re-derives
# mise.lock with the actual mise binary, then runs every hk auto-fixer, on every Renovate
# PR — the same two-part failure class that bit PR #7 and the taplo comment-alignment
# drift ADR-0002 noted as accepted-but-unfixed friction. `hk fix --all` (below) happens to
# fix that alignment drift too, as a side effect, not extra engineering.
#
# Two known, accepted limits (see dotfiles-<TBD> for the self-hosted-Renovate
# alternative that would remove both, at the cost of a standing PAT + signing key):
#  - Pushes made with the workflow's own GITHUB_TOKEN deliberately never retrigger other
#    workflows, so hk.yml keeps showing its pre-fix result on a PR this job pushes to.
#    This job's own final `mise run check` step is the real signal for Renovate PRs, not
#    hk.yml's (stale) status.
#  - Runs ubuntu-only, not hk.yml's [ubuntu-24.04, macos-15] matrix — the
#    chezmoi-templates gate only exercises the OS-gated template branches for the OS
#    it's running on (script/lint/chezmoi-templates.sh), so macOS-side branches go
#    unexercised here. Sufficient for tool-version/action-digest bumps, which is all
#    Renovate produces in this repo.
#
# Doesn't touch main's ruleset: that requires signed commits but is scoped to
# ~DEFAULT_BRANCH only (ADR-0002), so an unsigned push to the PR's own branch is
# unaffected — merging into main still goes through the normal signed PR-merge path
# ADR-0002 already documents for Renovate PRs.
on:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  autofix:
    # Same-repo Renovate PRs only: a fork PR has no business getting a contents:write
    # push, and a human PR has no reason to run this at all.
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # Only this job escalates past the workflow-level contents: read — needed to push
      # the repair commit back onto the PR branch (see the push step below).
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          # We push with an explicit tokenized URL (below), never a persisted credential —
          # keeps the token out of .git/config for the step's whole lifetime and avoids
          # zizmor's artipacked finding outright rather than needing a suppression.
          persist-credentials: false
      # hk's zsh-syntax step shells out to `zsh -n`; not preinstalled on this runner, not
      # mise-managed. No `if: runner.os == 'Linux'` guard needed — see the ubuntu-only note
      # above, this job has only the one runner.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          # Neither `mise install` nor its --locked form yet: a lockfile Renovate just
          # edited may have no valid URL/checksum for this platform at all, and
          # `--locked` would hard-fail before `mise lock` gets a chance to repair it.
          install: false
      - name: repair mise.lock checksums
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Bare `mise lock`, no --bump: repairs checksums/URLs for every platform already
        # in the lockfile, at the versions Renovate pinned. --bump would re-resolve
        # "latest" and fight Renovate for control of versions. GITHUB_TOKEN is for API
        # rate limit only (~16 tools' worth of release lookups) — same rationale hk.yml
        # documents for pinact.
        run: mise lock
      - run: mise install
      - name: apply hk auto-fixes
        # mise.toml's canonical `fix` task: `hk fix --all --no-stage`. Deliberately never
        # stages on its own (see that task's own description) — this job stages+commits
        # explicitly below, only if there's something to commit.
        run: mise run fix
      - name: commit and push if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "renovate-autofix: nothing to fix"
            exit 0
          fi
          # github-actions[bot]'s standard identity. Verified this does NOT trip hk.pkl's
          # machine-identifiers email regex (its local-part character class excludes ']')
          # — if that regex is ever tightened, add this address to its allowlist.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: repair mise.lock checksums and apply hk formatters'
          # Plain push, no --force: a rejection here means the branch moved under us
          # (Renovate rebased, or a previous run of this same job already pushed) —
          # surface that as a failed job, not silently overwrite whatever's newer.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${HEAD_REF}"
      - name: verify the branch actually passes now
        # The authoritative signal for this PR — see the header comment on why hk.yml's
        # own status can't be trusted here.
        run: mise run check
