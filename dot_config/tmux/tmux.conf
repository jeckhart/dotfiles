
# qol improvements
set -g mouse on

# improve colors
set -g default-terminal 'screen-256color'
set-option -sa terminal-overrides ",xterm*:Tc"

# act like vim
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key -r C-h select-window -t :-
bind-key -r C-l select-window -t :+

# shift alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Set prefix
unbind C-b
set -g prefix C-Space
set -g prefix2 C-s
bind C-Space send-prefix
bind-key C-s send-prefix -2

# start window numbers at 1 to match keyboard order with tmux window order
set -g base-index 1
set-window-option -g pane-base-index 1

# renumber windows sequentially after closing any of them
set -g renumber-windows on

# remove administrative debris (session name, hostname, time) in status bar
# set -g status-left ''
set -g status-right ''

# increase scrollback lines
set -g history-limit 10000

# prefix -> back-one-character
bind-key C-b send-prefix
# prefix-2 -> forward-incremental-history-search
bind-key C-s send-prefix -2

# don't suspend-client
unbind-key C-z

# Install plugins, pinned to tags. tmux-cpu is deliberately UNPINNED: TPM's install
# script only ever runs `git clone -b "$branch" --single-branch` (confirmed by reading
# scripts/install_plugins.sh) -- it has no fallback to checkout an arbitrary commit, so
# a bare SHA after `#` silently fails to clone. tmux-plugins/tmux-cpu has never tagged a
# release, so there is no ref TPM can actually pin it to.
set -g @plugin 'tmux-plugins/tpm#v3.1.0'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery#v2.0.0'
set -g @plugin 'tmux-plugins/tmux-sensible#v3.0.0'
set -g @plugin 'christoomey/vim-tmux-navigator#v1.0'
set -g @plugin 'catppuccin/tmux#v2.3.0'

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
#set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# Configure the catppuccin plugin
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_window_status_style "rounded"

run '~/.tmux/plugins/tpm/tpm'
